
name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_SERVER_IP }}
          username: root
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /ACTIONS_TUTORIAL
            git pull
            docker compose up -d --build
