
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Express Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            max-width: 600px;
            width: 100%;
            padding: 35px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 12px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.7;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 22px 0;
        }

        .skill {
            background: #334155;
            color: #7dd3fc;
            padding: 9px 14px;
            border-radius: 8px;
        }

        button {
            background: #0284c7;
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 20px;
        }

        button:hover {
            background: #0369a1;
        }

        #result {
            margin-top: 20px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1 id="name">Loading...</h1>
        <p id="role">Fetching data from Express server...</p>

        <div class="skills" id="skills"></div>

        <p id="status"></p>

        <button id="fetchBtn">Fetch Backend Data</button>

        <p id="result" aria-live="polite"></p>
    </main>

    <script>
        async function loadData() {
            const result = document.getElementById("result");
            result.textContent = "Loading data...";

            try {
                const response = await fetch("/api/info");

                if (!response.ok) {
                    throw new Error("Failed to fetch backend data");
                }

                const data = await response.json();

                document.getElementById("name").textContent = data.name;
                document.getElementById("role").textContent = data.role;
                document.getElementById("status").textContent = data.status;

                const skillsContainer = document.getElementById("skills");
                skillsContainer.replaceChildren();

                data.skills.forEach(skill => {
                    const span = document.createElement("span");
                    span.className = "skill";
                    span.textContent = skill;
                    skillsContainer.appendChild(span);
                });

                result.textContent = "Backend data loaded successfully!";
            } catch (error) {
                result.textContent = "Error: " + error.message;
            }
        }

        document.getElementById("fetchBtn").addEventListener("click", loadData);

        loadData();
    </script>
</body>
</html>
